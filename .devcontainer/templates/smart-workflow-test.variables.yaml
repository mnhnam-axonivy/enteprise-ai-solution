# yaml-language-server: $schema=https://json-schema.axonivy.com/14.0-dev/config/variables.json
Variables:
  AI:
    Providers:
      OpenAI:
        #[password]
        APIKey:
      LiteLLM:
        DefaultProxy: local-proxy
        Proxies:
          local-proxy:
            # 'litellm' is the compose service name - the engine runs in a sibling container.
            BaseUrl: http://litellm:4000/v1
            #[password]
            APIKey: sk-local-master-key
            Model: mock-echo
    Observability:
      Openinference:
        Enabled: true
    RAG:
      OpenSearch:
        Url: http://opensearch:9200
