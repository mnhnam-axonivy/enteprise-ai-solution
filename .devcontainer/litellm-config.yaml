# LiteLLM proxy config - minimal placeholder, extend with real model_list later.
model_list:

litellm_settings:
  drop_params: true

general_settings:
  # Read from the environment so LITELLM_MASTER_KEY is honoured; a hardcoded value here
  # would silently override it.
  master_key: os.environ/LITELLM_MASTER_KEY
